<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор ипотеки</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            background: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #1f2d3d;
        }

        .container {
            height: 100%;
            overflow-y: auto;
            padding: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .shadow-wrapper {
            width: 100%;
            min-height: 600px;
        }

        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 70vh;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-box {
            background: #fee2e2;
            border-left: 4px solid #dc2626;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin: 20px;
        }

        .error-box button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 16px;
            margin-top: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="shadow-wrapper">
        <div id="loader" class="loader">
            <div class="spinner"></div>
            <p>Загрузка калькулятора ипотеки...</p>
            <p style="font-size: 13px; color: #6c757d; margin-top: 8px;">Пожалуйста, подождите</p>
        </div>
    </div>
</div>

<!-- 1. Эмуляция Telegram WebApp (на случай, если калькулятор её вызывает) -->
<script>
    (function() {
        if (!window.Telegram) window.Telegram = {};
        if (!window.Telegram.WebApp) {
            window.Telegram.WebApp = {
                ready: () => {},
                expand: () => {},
                close: () => {},
                MainButton: {
                    show: () => {},
                    hide: () => {},
                    setText: () => {},
                    onClick: () => {}
                },
                onEvent: () => {}
            };
        }
    })();
</script>

<!-- 2. jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- 3. Скрипт калькулятора -->
<script>
    let isInitialized = false;

    function hideLoader() {
        const loader = document.getElementById('loader');
        if (loader) loader.style.display = 'none';
    }

    function showError(message) {
        const container = document.querySelector('.shadow-wrapper');
        if (container) {
            container.innerHTML = `
                <div class="error-box">
                    <strong>❌ Ошибка</strong><br><br>
                    ${message}<br><br>
                    <button onclick="location.reload()">Обновить страницу</button>
                </div>
            `;
        }
    }

    function initCalculator() {
        if (isInitialized) return;

        if (typeof jQuery === 'undefined') {
            console.warn('jQuery ещё не загружен, ждём...');
            setTimeout(initCalculator, 100);
            return;
        }

        if (typeof attachInsuranceForm !== 'function') {
            console.warn('attachInsuranceForm ещё не готова, ждём...');
            setTimeout(initCalculator, 200);
            return;
        }

        isInitialized = true;
        hideLoader();

        try {
            attachInsuranceForm('.shadow-wrapper');
            console.log('✅ Калькулятор запущен');
        } catch (e) {
            console.error(e);
            showError('Ошибка при запуске калькулятора: ' + e.message);
        }
    }

    // Динамическая загрузка локального скрипта
    (function loadInsuranceScript() {
        // Если уже загружен — запускаем
        if (typeof attachInsuranceForm === 'function') {
            window.addEventListener('load', () => setTimeout(initCalculator, 100));
            return;
        }

        const script = document.createElement('script');
        script.src = 'insuranceForm.js';  // ← ЛОКАЛЬНЫЙ путь
        script.onload = function() {
            console.log('✅ insuranceForm.js загружен');
            setTimeout(initCalculator, 100);
        };
        script.onerror = function() {
            showError('Не удалось загрузить insuranceForm.js. Проверьте, что файл лежит рядом с max.html.');
        };
        document.head.appendChild(script);
    })();
</script>
</body>
</html>
